<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>SHRUNK — Tabletop Racing</title><link rel="stylesheet" href="style.css"></head><body><a href="../../" aria-label="Back to SHRUNK" style="position:fixed;z-index:9999;left:max(8px,env(safe-area-inset-left));bottom:max(8px,env(safe-area-inset-bottom));padding:7px 10px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(15,18,15,.78);color:#f3f0df;text-decoration:none;font:800 9px/1 system-ui;letter-spacing:.12em;backdrop-filter:blur(8px)">BACK TO SHRUNK</a><main><canvas id="game"></canvas><header><b>SHRUNK</b><span>TABLETOP RACING</span><span id="lap">LAP 1/2</span><span id="time">0.0</span><button id="pause" aria-label="Pause race" disabled>II</button></header><section id="start" class="card"><h1>TABLETOP RACING</h1><p>You've been shrunk. The table is the track.</p><button id="drop">DROP IN</button><small>LEFT THUMB GAS &middot; SLIDE UP FOR BOOST &middot; RIGHT THUMB STEERS</small></section><section id="result" class="card hidden"><h2>FINISH</h2><strong id="finish"></strong><p id="best"></p><button id="again">RACE AGAIN</button></section><div id="steer" class="pad"><label>STEER</label><i></i></div><div id="gas" class="pad"><label>GAS</label><i></i><em>SLIDE UP FOR BOOST</em></div><section id="pause-panel" class="hidden" role="dialog" aria-modal="true" aria-labelledby="pause-title"><div class="card"><h2 id="pause-title">RACE PAUSED.</h2><button id="resume">KEEP RACING</button><button id="restart">RESTART RACE</button><button id="pause-home">BACK TO SHRUNK</button></div></section></main><script type="module" src="app.mjs"></script></body></html>
